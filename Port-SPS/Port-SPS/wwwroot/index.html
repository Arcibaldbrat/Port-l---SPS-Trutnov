<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Školní portál - SPS Trutnov</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="splash-container">
        <div class="splash-content">
            <img src="elogo.png" alt="Logo" title="SPS Trutnov" style="width: 100px; height: 100px; margin-bottom: 1rem;">
            <h1>📚 SPS Trutnov</h1>
            <p>Školní portál</p>
            <p style="font-size: 1rem; opacity: 0.9;">Kompletní řešení pro správu školních informací a komunikaci.</p>

            <div class="cta-buttons">
                <a href="login.html" class="cta-btn primary">Přihlásit se</a>
                <a href="dashboard.html" class="cta-btn secondary">Pokračovat do portálu</a>
            </div>

            <div class="splash-features">
                <div class="feature">
                    <div class="feature-icon">📊</div>
                    <div class="feature-text">Přehled</div>
                </div>
                <div class="feature">
                    <div class="feature-icon">📅</div>
                    <div class="feature-text">Rozvrh</div>
                </div>
                <div class="feature">
                    <div class="feature-icon">📝</div>
                    <div class="feature-text">Známky</div>
                </div>
                <div class="feature">
                    <div class="feature-icon">💬</div>
                    <div class="feature-text">Zprávy</div>
                </div>
                <div class="feature">
                    <div class="feature-icon">👥</div>
                    <div class="feature-text">Třídy</div>
                </div>
                <div class="feature">
                    <div class="feature-icon">🚻</div>
                    <div class="feature-text">Toalety</div>
                </div>
            </div>
        </div>
    </div>

    <footer class="footer" style="position: absolute; bottom: 0; width: 100%;">
        <div class="footer-content">
            <p>&copy; 2026 Střední průmyslová škola Trutnov. Všechna práva vyhrazena.</p>
        </div>
    </footer>

    <script>
        if (localStorage.getItem('portalUser')) {
            window.location.href = 'dashboard.html';
        }
    </script>
</body>
</html>
