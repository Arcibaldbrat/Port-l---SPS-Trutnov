<!DOCTYPE html>
<html lang="cs">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Nastavení - SPS Trutnov</title><link rel="stylesheet" href="style.css"></head>
<body>
    <header class="header"><div class="header-content"><div class="logo"><img src="elogo.png" alt="Logo"><div><h1>📚 SPS Trutnov</h1><p>Školní portál</p></div></div><div class="user-info"><span class="user-greeting" id="userGreeting"></span><button class="logout-btn" onclick="handleLogout()">Odhlásit se</button></div></div></header>
    <nav class="nav-menu"><div class="nav-container"><a href="profile.html" class="nav-link">Profil</a><a href="settings.html" class="nav-link active">Nastavení</a></div></nav>
    <div class="container"><section class="section" style="display:block"><h2>Nastavení</h2><div class="portal-grid"><div class="portal-card"><h3>Notifikace</h3><form class="portal-form"><label><input type="checkbox" checked> Zprávy od učitelů</label><label><input type="checkbox" checked> Nové známky</label><label><input type="checkbox"> Připomenutí jídelny</label><button type="button" class="btn-primary">Uložit nastavení</button></form></div><div class="portal-card"><h3>Vzhled</h3><p>Tmavý režim zapneš tlačítkem ◐ nahoře v hlavičce.</p></div><div class="portal-card"><h3>Bezpečnost</h3><p>Hesla jsou ukládaná jako hash v databázi.</p><button type="button" class="btn-secondary">Změnit heslo</button></div></div></section></div>
    <script src="portal-auth.js"></script>
</body>
</html>
