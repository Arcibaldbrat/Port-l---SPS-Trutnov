<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Přihlášení - SPS Trutnov</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="login-container">
        <div class="login-card">
            <img src="elogo.png" alt="Logo" title="SPS Trutnov" style="width: 80px; height: 80px; margin-bottom: 1rem;">
            <h1>SPS Trutnov</h1>
            <p class="subtitle">Školní portál - přihlášení</p>

            <div class="error-message" id="errorMessage"></div>

            <form id="loginForm">
                <div class="form-group">
                    <label for="username">Uživatelské jméno nebo email</label>
                    <input type="text" id="username" name="username" autocomplete="username" required>
                </div>

                <div class="form-group">
                    <label for="password">Heslo</label>
                    <input type="password" id="password" name="password" autocomplete="current-password" required>
                </div>

                <div class="remember-forgot">
                    <label style="display: flex; align-items: center; gap: 0.5rem;">
                        <input type="checkbox" id="rememberMe" name="rememberMe">
                        <span>Zapamatovat si mě</span>
                    </label>
                    <a href="#">Zapomenuté heslo?</a>
                </div>

                <button type="submit" class="login-btn">Přihlásit se</button>
            </form>

            <div class="login-footer">
                <p>Demo účty:</p>
                <p><strong>student</strong> / Student123!</p>
                <p><strong>ucitel</strong> / Teacher123!</p>
                <p><strong>admin</strong> / Admin123!</p>
            </div>
        </div>
    </div>

    <script src="portal-auth.js"></script>
    <script>
        document.getElementById('loginForm').addEventListener('submit', async function(e) {
            e.preventDefault();

            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            const rememberMe = document.getElementById('rememberMe').checked;
            const errorMessage = document.getElementById('errorMessage');

            errorMessage.style.display = 'none';

            if (username.trim() === '' || password.trim() === '') {
                errorMessage.textContent = 'Prosím, vyplňte všechna pole.';
                errorMessage.style.display = 'block';
                return;
            }

            try {
                const response = await fetch('/api/auth/login', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    credentials: 'same-origin',
                    body: JSON.stringify({ username, password, rememberMe })
                });

                if (!response.ok) {
                    errorMessage.textContent = 'Neplatné uživatelské jméno nebo heslo.';
                    errorMessage.style.display = 'block';
                    return;
                }

                const user = await response.json();
                window.portalAuth.storeUser(user);
                if (rememberMe) {
                    localStorage.setItem('rememberMe', 'true');
                }

                window.location.href = 'dashboard.html';
            } catch {
                errorMessage.textContent = 'Nepodařilo se připojit k serveru.';
                errorMessage.style.display = 'block';
            }
        });

        if (localStorage.getItem('portalUser')) {
            window.location.href = 'dashboard.html';
        }
    </script>
</body>
</html>
