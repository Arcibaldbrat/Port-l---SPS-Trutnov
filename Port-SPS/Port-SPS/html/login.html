<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Přihlášení - SPS Trutnov</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="login-container">
        <div class="login-card">
            <h1>📚 SPS Trutnov</h1>
            <p class="subtitle">Školní portál - Přihlášení</p>

            <div class="error-message" id="errorMessage"></div>

            <form id="loginForm">
                <div class="form-group">
                    <label for="username">Uživatelské jméno</label>
                    <input type="text" id="username" name="username" required>
                </div>

                <div class="form-group">
                    <label for="password">Heslo</label>
                    <input type="password" id="password" name="password" required>
                </div>

                <div class="remember-forgot">
                    <label style="display: flex; align-items: center; gap: 0.5rem;">
                        <input type="checkbox" id="rememberMe" name="rememberMe">
                        <span>Zapamatovat si mě</span>
                    </label>
                    <a href="#">Zapomenuté heslo?</a>
                </div>

                <button type="submit" class="login-btn">Přihlásit se</button>
            </form>

            <div class="login-footer">
                <p>&copy; 2026 SPS Trutnov. Všechna práva vyhrazena.</p>
            </div>
        </div>
    </div>

    <script>
        document.getElementById('loginForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            const rememberMe = document.getElementById('rememberMe').checked;
            const errorMessage = document.getElementById('errorMessage');

            // Simple validation - in production, would send to server
            if (username.trim() === '' || password.trim() === '') {
                errorMessage.textContent = 'Prosím, vyplňte všechna pole.';
                errorMessage.style.display = 'block';
                return;
            }

            // Store user info (in production, would use secure session)
            localStorage.setItem('user', username);
            if (rememberMe) {
                localStorage.setItem('rememberMe', 'true');
            }

            // Redirect to dashboard
            window.location.href = 'dashboard.html';
        });

        // Check if user is already logged in
        if (localStorage.getItem('user')) {
            window.location.href = 'dashboard.html';
        }
    </script>
</body>
</html>
