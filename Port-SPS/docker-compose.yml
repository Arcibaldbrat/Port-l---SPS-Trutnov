services:
  port-sps:
    image: ${DOCKER_REGISTRY-}portsps
    build:cd Port-SPS
dotnet runcd Port-SPS
dotnet run
      context: .
      dockerfile: Port-SPS/Dockerfile
    ports:
      - "5028:8080"
    environment:
      ASPNETCORE_URLS: "http://+:8080"
      DatabaseProvider: "SqlServer"
      ConnectionStrings__DefaultConnection: "Server=db,1433;Database=PortSpsPortal;User Id=sa;Password=${SA_PASSWORD:-YourStrong!Passw0rd};TrustServerCertificate=True;MultipleActiveResultSets=true"
    depends_on:
      db:
        condition: service_healthy

  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "${SA_PASSWORD:-YourStrong!Passw0rd}"
    ports:
      - "1433:1433"
    volumes:
      - port-sps-sql-data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$${MSSQL_SA_PASSWORD}\" -C -Q \"SELECT 1\" || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12

volumes:
  port-sps-sql-data:
